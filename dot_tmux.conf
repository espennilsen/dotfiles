##### Prefix & basics #####

# Remap prefix key to Ctrl+a (Screen style)
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Enable mouse support for selection & window switching
set -g mouse on

# Increase scrollback history
set -g history-limit 100000

# Start windows and panes numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use vi keybinds in copy mode and status line
set -g status-keys vi
setw -g mode-keys vi

# Faster escape (Vim / Neovim feel)
set -g escape-time 10

# Enable extended keys (modified Enter, etc.) for modern terminals
set -g extended-keys on

# Let tmux cooperate with terminal clipboard (OSC 52 etc.)
set-option -g set-clipboard on

# Rely on Ghostty's TERM (xterm-ghostty); no default-terminal override.
# If you ever need a fallback for broken remotes, you can add:
# set -g default-terminal "tmux-256color"

##### Key bindings #####

# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf!"

# Vim-like selection/yank in copy-mode-vi, yanking to macOS clipboard
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Resize panes with vi keys (hold Prefix, then h/j/k/l; repeat without Prefix)
bind-key -r k resize-pane -U 5    # Up (horizontal split up)
bind-key -r j resize-pane -D 5    # Down (horizontal split down)
bind-key -r h resize-pane -L 5    # Left
bind-key -r l resize-pane -R 5    # Right

# Split window binds
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Lazygit
bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"
##### Status line #####

# Status bar: show prefix highlight and current time
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

# Search
bind-key / copy-mode \; send-keys /

##### Sesh (smart session manager) #####

# Don't exit tmux when closing a session
set -g detach-on-destroy off

# Skip "kill-pane?" confirmation prompt
bind-key x kill-pane

# Sesh session picker (Prefix + T) — fzf popup
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Switch to last session (Prefix + L)
bind -N "last-session (via sesh) " L run-shell "sesh last"

# Neovim needs this to detect when you switch between tmux panes
focus-events on

##### Plugin Section (TPM) #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Optional extras (uncomment if you want them):
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-autoreload'

# Initialize TPM (keep this last!)
run '~/.tmux/plugins/tpm/tpm'
